<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PayLedger Dashboard</title>
</head>

<body>

    <h1>Welcome to PayLedger</h1>

    <h2>Hello, {{ current_user.name }}!</h2>

    <p>Email: {{ current_user.email }}</p>

    <p>Role: {{ current_user.role }}</p>

    <p>
        Verification Status:
        {{ current_user.verification_status }}
    </p>

    <p>
        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>
    </p>

</body>

</html>
